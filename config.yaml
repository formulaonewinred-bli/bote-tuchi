# ===== ボートレース 直前通知の設定 =====
# 値を変えたら commit するだけで次回の実行から反映されます。

# --- 候補の条件（ガチガチ条件）---
nige_min: 70        # 1号艇の逃げ率（%）がこれ以上
nigashi_min: 35     # 2号艇の逃し率（%）がこれ以上
min_samples: 0      # 逃げ率/逃し率の母数（1コース・2コース進入回数）の下限。0なら制限なし
stats_days: 180     # 逃げ率・逃し率を集計する期間（日）

# --- 対象レースの種類（どれか1つに当たれば対象）---
target_race12: true     # 12R
target_yusho: true      # 優勝戦
target_junyu: true      # 準優勝戦
exclude_lady_races: true  # 女子戦（出走6人全員が女子）のレースは除外
exclude_grades: ["G1"]    # このグレードの開催は除外（PG1も含む）。SGも外すなら ["G1", "SG"]

# 企画レース（マクール「24場 企画レース一覧」https://sp.macour.jp/s/kikaku/ より）
# 場名: [R番号, ...]   一覧が変わったらここを書き換えてください。
kikaku:
  桐生: [6, 7, 8]
  戸田: [5, 7]
  江戸川: []
  平和島: [5, 8]      # 薄暮期間は「東京ベイランチ」が2Rになるので 5 → 2 に変更
  多摩川: []
  浜名湖: [4, 8]
  蒲郡: [7]
  常滑: [1, 6]
  津: [1, 5]
  三国: [1, 2, 3, 4]
  びわこ: []
  住之江: [1, 5]      # 1R（住之江ONE）は特定の節のみ実施
  尼崎: [1, 6]
  鳴門: [1, 2, 3, 4]
  丸亀: [6, 7, 8]
  児島: [1, 4, 5, 9]
  宮島: [1, 5, 6]     # ランチタイムは5Rまたは6R
  徳山: [1, 2, 3, 4, 9]
  下関: [5, 7]
  若松: [5, 8]
  芦屋: [1, 2, 3, 4, 5, 7]
  福岡: [1, 3]
  唐津: [1, 2, 3, 4]
  大村: [7]

# --- 締切前チェック（除外条件）---
check_minutes_before: 18   # 締切の何分前にチェックを始めるか（通知は確認後すぐ）
require_wakunari: true     # スタート展示が枠なり（1-2-3-4-5-6）でなければ除外
exhibit_retry_times: 2     # 展示がまだ出ていない時の再確認回数
exhibit_retry_interval_sec: 120
odds_first: "1-2-3"        # 3連単1番人気がこれでなければ除外
odds_second: "1-3-2"       # 3連単2番人気がこれでなければ除外
odds_first_max: 10.0       # 1番人気のオッズがこの値以上なら除外（= 1桁台のみ通知）
notify_unverified: true    # 展示/オッズが読めなかった時も「⚠未確認」付きで通知する

# --- 通知 ---
morning_summary: true      # 朝の実行でその日のチェック対象一覧を通知する
