name: monitor

on:
  schedule:
    # GitHub の cron は UTC（日本時間 = UTC + 9）。定期実行は遅れることがあるので30分おきに起動し、
    # 動いている実行があれば次は待機（concurrency）。処理済みレースは state/ に記録して二重通知を防ぐ。
    - cron: "7,37 22,23 * * *"   # 07:07〜08:37 JST
    - cron: "7,37 0-11 * * *"    # 09:07〜20:37 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=今日の残りレースを監視 / dryrun-today=今日の対象一覧を通知 / test-past=過去日で判定テスト / test-notify=通知テスト"
        type: choice
        options: [auto, dryrun-today, test-past, test-notify]
        default: test-notify
      date:
        description: "test-past で使う日付（YYYYMMDD、空なら昨日）"
        required: false
        default: ""

permissions:
  contents: write   # state/ の処理済み記録を保存するため

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: monitor
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          python -m bot.monitor
          --mode "${{ inputs.mode || 'auto' }}"
          --date "${{ inputs.date }}"
