name: monitor

on:
  schedule:
    # GitHub の cron は UTC（日本時間 = UTC + 9）。定期実行は遅れることがあるので30分おきに起動し、
    # 動いている実行があれば次は待機（concurrency）。処理済みレースは state/ に記録して二重通知を防ぐ。
    - cron: "7,37 22,23 * * *"   # 07:07〜08:37 JST
    - cron: "7,37 0-11 * * *"    # 09:07〜20:37 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=今日の残りレースを監視 / list=今日の対象をログに出すだけ / dryrun-today=今日の対象一覧を通知 / test-past=過去日で判定テスト / test-notify=通知テスト"
        type: choice
        options: [auto, list, dryrun-today, test-past, test-notify]
        default: test-notify
      date:
        description: "test-past で使う日付（YYYYMMDD、空なら昨日）"
        required: false
        default: ""

permissions:
  contents: write   # state/ の処理済み記録を保存するため

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 逃げ率データと的中まとめの更新
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        continue-on-error: true
        run: |
          sudo apt-get install -y lhasa >/dev/null 2>&1 || (sudo apt-get update >/dev/null && sudo apt-get install -y lhasa >/dev/null)
          python -m bot.stats
          python -m bot.results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data REPORT.md
          git diff --cached --quiet || git commit -q -m "update stats/results $(date -u +%Y-%m-%d)"
          git pull -q --rebase -X theirs || true
          git push -q || true
      - name: monitor
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >
          python -m bot.monitor
          --mode "${{ inputs.mode || 'auto' }}"
          --date "${{ inputs.date }}"
